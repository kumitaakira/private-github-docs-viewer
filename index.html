    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        details>summary {
            list-style: none;
        }

        details>summary::-webkit-details-marker {
            display: none;
        }

        .waiting-orbit {
            position: relative;
            width: 4rem;
            height: 4rem;
        }

        .waiting-orbit::before,
        .waiting-orbit::after {
            content: '';
            position: absolute;
            inset: 0.35rem;
            border-radius: 9999px;
            border: 1px solid rgb(37 99 235 / 0.3);
            animation: waiting-pulse 1.8s ease-in-out infinite;
        }

        .waiting-orbit::after {
            inset: 1rem;
            border-color: rgb(189 147 249 / 0.4);
            animation-delay: -0.6s;
        }

        .waiting-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 9999px;
            background: rgb(37 99 235);
            transform-origin: -1.35rem -1.35rem;
            animation: waiting-orbit 1.4s linear infinite;
        }

        .dark .waiting-dot {
            background: #bd93f9;
        }

        .waiting-dot:nth-child(2) {
            animation-delay: -0.45s;
            opacity: 0.75;
        }

        .waiting-dot:nth-child(3) {
            animation-delay: -0.9s;
            opacity: 0.55;
        }

        @keyframes waiting-orbit {
            from {
                transform: rotate(0deg) translateX(1.35rem) rotate(0deg);
            }

            to {
                transform: rotate(360deg) translateX(1.35rem) rotate(-360deg);
            }
        }

        @keyframes waiting-pulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.35;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.9;
            }
        }

        #pdf-pages-wrapper {
            transition: width 0.2s ease-out;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-flex;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;
        }

        .icon-btn {
            width: 2.25rem;
            height: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
        }

        .tree-list {
            position: relative;
        }

        .tree-list.nested {
            margin: 0.25rem 0 0.25rem 1rem;
            padding-left: 0.75rem;
            border-left: 1px solid rgb(209 213 219 / 0.8);
        }

        .dark .tree-list.nested {
            border-left-color: rgb(68 71 90 / 0.9);
        }

        .tree-row {
            min-height: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 0.5rem;
            padding: 0.35rem 0.5rem;
            transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .tree-row:hover {
            background: rgb(243 244 246);
        }

        .dark .tree-row:hover {
            background: rgb(68 71 90 / 0.75);
        }

        .tree-row.active {
            background: rgb(219 234 254);
            color: rgb(29 78 216);
            box-shadow: inset 3px 0 0 rgb(37 99 235);
        }

        .dark .tree-row.active {
            background: rgb(68 71 90);
            color: #8be9fd;
            box-shadow: inset 3px 0 0 #8be9fd;
        }

        .tree-chevron {
            font-size: 18px;
            color: rgb(107 114 128);
            transition: transform 0.15s ease;
        }

        .dark .tree-chevron {
            color: #6272a4;
        }

        details[open]>summary .tree-chevron {
            transform: rotate(90deg);
        }

        .tree-file-icon,
        .tree-folder-icon {
            font-size: 20px;
            flex: 0 0 auto;
        }

        .tree-folder-icon {
            color: rgb(234 179 8);
        }

        .tree-file-icon.pdf {
            color: rgb(239 68 68);
        }

        .tree-file-icon.md {
            color: rgb(37 99 235);
        }

        .dark .tree-folder-icon {
            color: #f1fa8c;
        }

        .dark .tree-file-icon.pdf {
            color: #ff5555;
        }

        .dark .tree-file-icon.md {
            color: #8be9fd;
        }

        .search-clear-btn {
            position: absolute;
            top: 50%;
            right: 0.5rem;
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transform: translateY(-50%);
        }

        .search-clear-btn .material-symbols-outlined {
            display: block;
            font-size: 20px;
            line-height: 1;
        }

        .segmented-control {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.25rem;
            padding: 0.25rem;
            border-radius: 0.5rem;
            background: rgb(243 244 246);
            border: 1px solid rgb(229 231 235);
        }

        .dark .segmented-control {
            background: #282a36;
            border-color: #44475a;
        }

        .search-mode-btn {
            min-height: 1.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            color: rgb(75 85 99);
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .dark .search-mode-btn {
            color: #6272a4;
        }

        .search-mode-btn.active {
            background: white;
            color: rgb(37 99 235);
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
        }

        .dark .search-mode-btn.active {
            background: #44475a;
            color: #8be9fd;
        }

        .search-result-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            border-radius: 0.5rem;
            padding: 0.5rem;
            text-align: left;
            width: 100%;
            transition: background-color 0.15s ease;
        }

        .search-result-row:hover {
            background: rgb(243 244 246);
        }

        .dark .search-result-row:hover {
            background: rgb(68 71 90 / 0.75);
        }

        .search-highlight {
            background: rgb(254 240 138);
            color: rgb(113 63 18);
            border-radius: 0.2rem;
            padding: 0 0.1rem;
        }

        #scroll-container,
        #pdf-wrapper {
            overscroll-behavior: contain;
            touch-action: pan-x pan-y;
        }

        .dark .search-highlight {
            background: #f1fa8c;
            color: #21222c;
        }

        .shortcut-kbd {
            min-width: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            border: 1px solid rgb(209 213 219);
            background: rgb(249 250 251);
            padding: 0.125rem 0.375rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.75rem;
            color: rgb(55 65 81);
        }

        .dark .shortcut-kbd {
            border-color: #44475a;
            background: #282a36;
            color: #f8f8f2;
        }

        /* Markdown 背景の透過化 (Light/Dark共通) */
        .markdown-body {
            background-color: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 2em;
        }

        .markdown-body ul {
            list-style-type: disc;
        }

        .markdown-body ol {
            list-style-type: decimal;
        }

        .markdown-body ul ul {
            list-style-type: circle;
        }

        .markdown-body ul ul ul {
            list-style-type: square;
        }

        .markdown-body li {
            display: list-item;
        }

        .markdown-body .task-list-item {
            list-style-type: none;
        }

        .markdown-body .task-list-item-checkbox {
            margin: 0 0.45em 0.2em -1.4em;
            vertical-align: middle;
            accent-color: #2563eb;
        }

        .dark .markdown-body .task-list-item-checkbox {
            accent-color: #bd93f9;
        }

        /* Tables keep natural column widths and scroll as a unit. Wrapping the
           cell contents avoids the undefined max-width behavior of table cells
           under table-layout:auto (notably in WebKit). */
        .markdown-table-scroll {
            width: 100%;
            max-width: 100%;
            margin-block: 1.5rem;
            overflow-x: auto;
            border-radius: 0.5rem;
            scrollbar-width: thin;
        }

        .markdown-table-scroll>table {
            display: table;
            width: max-content;
            min-width: 100%;
            max-width: none;
            margin: 0;
            border-collapse: collapse;
            border-spacing: 0;
        }

        .markdown-table-scroll table thead,
        .markdown-table-scroll table tbody,
        .markdown-table-scroll table tfoot,
        .markdown-table-scroll table tr {
            border-width: 0;
        }

        .markdown-table-scroll table th,
        .markdown-table-scroll table td {
            padding: 0.5rem 0.875rem;
            vertical-align: top;
            border: 1px solid #d0d7de;
        }

        .markdown-table-cell {
            min-width: 1.75rem;
            max-width: 25rem;
            min-height: 1.5em;
            white-space: normal;
            overflow-wrap: break-word;
        }

        .markdown-table-cell:empty {
            min-width: 4rem;
        }

        .dark .markdown-table-scroll table th,
        .dark .markdown-table-scroll table td {
            border-color: #44475a;
        }

        /* Mermaid diagrams use the same measured typography in the temporary
           render tree and final SVG, preventing clipped labels and huge SVGs. */
        .mermaid-diagram {
            position: relative;
            margin-block: 1.5rem;
            overflow: hidden;
            border: 1px solid rgb(208 215 222 / 0.85);
            border-radius: 0.75rem;
            background: rgb(255 255 255 / 0.62);
            box-shadow: 0 1px 2px rgb(31 35 40 / 0.06);
        }

        .dark .mermaid-diagram {
            border-color: rgb(68 71 90 / 0.9);
            background: rgb(33 34 44 / 0.46);
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
        }

        .mermaid-stage {
            min-height: 5rem;
            padding: 1rem;
            overflow-x: auto;
            cursor: zoom-in;
        }

        .mermaid-stage:empty {
            display: none;
        }

        .mermaid-stage svg {
            display: block;
            width: auto !important;
            max-width: 100% !important;
            height: auto !important;
            max-height: 32rem !important;
            margin-inline: auto;
        }

        svg[id^="repo-mermaid-"] foreignObject div,
        svg[id^="repo-mermaid-"] foreignObject span,
        svg[id^="repo-mermaid-"] foreignObject p,
        svg[id^="repo-mermaid-"] .nodeLabel,
        svg[id^="repo-mermaid-"] .edgeLabel,
        svg[id^="repo-mermaid-"] .label {
            font-size: 16px !important;
            line-height: 1.5 !important;
        }

        svg[id^="repo-mermaid-"] foreignObject p {
            margin: 0 !important;
            padding: 0 !important;
        }

        .mermaid-source {
            margin: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
        }

        .mermaid-diagram.is-rendered .mermaid-source {
            display: none;
        }

        .mermaid-diagram .mermaid-status {
            display: none;
            padding: 0.65rem 0.9rem;
            border-top: 1px solid rgb(208 215 222 / 0.85);
            color: #b42318;
            background: rgb(254 243 242 / 0.9);
            font-size: 0.75rem;
        }

        .mermaid-diagram.has-error .mermaid-status {
            display: block;
        }

        .dark .mermaid-status {
            border-top-color: #44475a;
            color: #ffb4ab;
            background: rgb(85 28 28 / 0.28);
        }

        .mermaid-zoom-hint {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            display: grid;
            width: 1.75rem;
            height: 1.75rem;
            place-items: center;
            border: 1px solid rgb(208 215 222 / 0.9);
            border-radius: 0.5rem;
            color: #57606a;
            background: rgb(255 255 255 / 0.88);
            pointer-events: none;
        }

        .dark .mermaid-zoom-hint {
            border-color: #44475a;
            color: #8be9fd;
            background: rgb(33 34 44 / 0.88);
        }

        .mermaid-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 150;
            display: grid;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            place-items: center;
            padding: 3rem;
            overflow: hidden;
            overscroll-behavior: none;
            background: #0f1115;
            box-shadow: 0 0 0 100vmax #0f1115;
            backdrop-filter: blur(5px);
        }

        .mermaid-lightbox[hidden] {
            display: none;
        }

        .mermaid-lightbox-content {
            width: 100%;
            max-width: 92vw;
            max-height: 88vh;
            max-height: 88dvh;
            padding: 1.5rem;
            overflow: auto;
            overscroll-behavior: contain;
            touch-action: pan-x pan-y pinch-zoom;
            border-radius: 1rem;
            background: #ffffff;
            box-shadow: 0 24px 80px rgb(0 0 0 / 0.4);
        }

        html.mermaid-lightbox-open,
        html.mermaid-lightbox-open body {
            background: #0f1115 !important;
            overscroll-behavior: none;
        }

        body.mermaid-lightbox-open {
            position: fixed;
            inset: 0;
            width: 100%;
            overflow: hidden !important;
        }

        .dark .mermaid-lightbox-content {
            background: #21222c;
        }

        .mermaid-lightbox-content svg {
            display: block;
            min-width: min(100%, 50rem);
            max-width: none;
            height: auto;
            margin: auto;
        }

        @media (max-width: 640px) {
            .markdown-table-cell {
                max-width: 75vw;
            }

            .mermaid-lightbox {
                padding: 1rem;
            }
        }

        /* KaTeX ベーススタイル */
        .katex {
            font-size: 1.15em;
        }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 0.5em;
        }

        .dark .katex {
            color: #f8f8f2;
        }

        .dark .markdown-body .katex,
        .dark .markdown-body .katex * {
            color: #f8f8f2 !important;
        }

        .dark .markdown-body .katex .frac-line,
        .dark .markdown-body .katex .sqrt > .root,
        .dark .markdown-body .katex .sqrt > .sqrt-line,
        .dark .markdown-body .katex .overline .overline-line,
        .dark .markdown-body .katex .underline .underline-line,
        .dark .markdown-body .katex .rule {
            border-color: currentColor !important;
        }

        .dark .markdown-body .katex-display {
            background: rgb(68 71 90 / 0.32);
            border: 1px solid rgb(98 114 164 / 0.34);
            border-radius: 0.375rem;
            padding: 0.75rem 0.875rem;
        }

        :not(.dark) .katex {
            color: #1f2937;
        }

        /* Dark Markdown customization */
        .dark .markdown-body {
            color: #f8f8f2;
        }

        .dark .markdown-body h1,
        .dark .markdown-body h2,
        .dark .markdown-body h3,
        .dark .markdown-body h4,
        .dark .markdown-body h5,
        .dark .markdown-body h6 {
            color: #bd93f9;
            border-bottom-color: #44475a;
        }

        .dark .markdown-body a {
            color: #8be9fd;
        }

        .dark .markdown-body blockquote {
            color: #f1fa8c;
            border-left-color: #bd93f9;
        }

        .dark .markdown-body code {
            background-color: #44475a;
            color: #ff79c6;
        }

        .dark .markdown-body pre {
            background-color: #21222c !important;
            border: 1px solid #44475a;
        }

        .dark .markdown-body table tr {
            background-color: #282a36;
            border-top-color: #44475a;
        }

        .dark .markdown-body table tr:nth-child(2n) {
            background-color: #21222c;
        }

        .dark .markdown-body table th,
        .dark .markdown-body table td {
            border-color: #44475a;
        }

        .dark .markdown-body hr {
            background-color: #44475a;
        }

        /* ============================================================
           Unified reading theme — Aurora (dark) / Paper (light)
           ============================================================ */
        :root {
            color-scheme: light;
            --app-bg: #faf7f0;
            --app-panel: #fffdf8;
            --app-panel-raised: #ffffff;
            --app-fg: #2b2a26;
            --app-fg-dim: #565149;
            --app-muted: #8d867c;
            --app-border: #e7e0d3;
            --app-border-strong: #d8cebd;
            --app-hover: rgb(54 45 32 / 0.055);
            --app-accent: #b45309;
            --app-accent-2: #7c3aed;
            --app-accent-soft: rgb(180 83 9 / 0.11);
            --app-code-bg: #f4efe4;
            --app-code-head: #ece5d6;
            --app-input: #fffdf8;
            --app-danger: #dc2626;
            --app-shadow: 0 18px 55px rgb(79 61 34 / 0.12);
            --app-font: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
        }

        .dark {
            color-scheme: dark;
            --app-bg: #0e1116;
            --app-panel: #151a21;
            --app-panel-raised: #1a2029;
            --app-fg: #e6edf3;
            --app-fg-dim: #c2ccd6;
            --app-muted: #7d8894;
            --app-border: #232b35;
            --app-border-strong: #33404e;
            --app-hover: rgb(255 255 255 / 0.06);
            --app-accent: #4fd1c5;
            --app-accent-2: #a78bfa;
            --app-accent-soft: rgb(79 209 197 / 0.14);
            --app-code-bg: #0b0f14;
            --app-code-head: #12171e;
            --app-input: #0b0f14;
            --app-danger: #f87171;
            --app-shadow: 0 20px 65px rgb(0 0 0 / 0.34);
        }

        :root[data-theme="mist"] {
            color-scheme: light;
            --app-bg: #f1f5f7;
            --app-panel: #f9fbfc;
            --app-panel-raised: #ffffff;
            --app-fg: #20303b;
            --app-fg-dim: #4b5f6c;
            --app-muted: #73838d;
            --app-border: #d6e0e5;
            --app-border-strong: #becbd2;
            --app-hover: rgb(30 93 111 / 0.065);
            --app-accent: #0f7185;
            --app-accent-2: #6554c0;
            --app-accent-soft: rgb(15 113 133 / 0.12);
            --app-code-bg: #e4ecef;
            --app-code-head: #d8e4e8;
            --app-input: #ffffff;
            --app-shadow: 0 18px 55px rgb(35 64 76 / 0.12);
        }

        :root[data-theme="midnight"] {
            color-scheme: dark;
            --app-bg: #090f1d;
            --app-panel: #10192b;
            --app-panel-raised: #162138;

    <div id="workspace-view" class="hidden flex-col h-full w-full relative">

        <header
            class="bg-white dark:bg-dracula-sidebar p-3 shadow-sm dark:shadow-md flex justify-between items-center shrink-0 border-b border-gray-200 dark:border-dracula-current z-20 transition-colors">
            <div class="flex items-center">
                <button id="menu-btn"
                    class="icon-btn text-gray-500 hover:text-gray-900 hover:bg-gray-100 dark:text-dracula-comment dark:hover:text-dracula-fg dark:hover:bg-dracula-current mr-2 focus:outline-none transition-colors"
                    title="メニュー">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="text-lg font-bold truncate max-w-[150px] sm:max-w-[200px] text-gray-800 dark:text-dracula-purple"
                    id="header-title">Docs Viewer</h1>
            </div>

            <div class="header-actions">
                <button id="focus-search-btn"
                    class="icon-btn text-gray-600 hover:text-gray-900 hover:bg-gray-100 dark:text-dracula-comment dark:hover:text-dracula-fg dark:hover:bg-dracula-current transition-colors"
                    title="検索">
                    <span class="material-symbols-outlined">search</span>
                </button>
                <button id="shortcuts-btn"
                    class="icon-btn text-gray-600 hover:text-gray-900 hover:bg-gray-100 dark:text-dracula-comment dark:hover:text-dracula-fg dark:hover:bg-dracula-current transition-colors"
                    title="ショートカット">
                    <span class="material-symbols-outlined">keyboard_command_key</span>
                </button>
                <label class="theme-select-wrap" title="表示テーマ">
                    <span class="material-symbols-outlined" aria-hidden="true">palette</span>
                    <select id="theme-select" aria-label="表示テーマ">
                        <option value="aurora">Aurora</option>
                        <option value="midnight">Midnight</option>
                        <option value="paper">Paper</option>
                        <option value="mist">Mist</option>
                    </select>
                </label>

                <button id="logout-btn"
                    class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 dark:bg-dracula-bg dark:hover:bg-dracula-current dark:text-dracula-comment dark:hover:text-dracula-fg py-1.5 px-3 rounded border border-gray-200 dark:border-dracula-current transition-colors">
                    <span class="material-symbols-outlined connection-icon" aria-hidden="true">dns</span>
                    <span class="connection-label">接続先</span>
                </button>
            </div>
        </header>

        <div
            class="flex-grow relative flex overflow-hidden bg-gray-50 dark:bg-dracula-bg w-full h-full transition-colors">

            <div id="sidebar-overlay"
                class="absolute inset-0 bg-black bg-opacity-40 dark:bg-opacity-60 z-30 hidden transition-opacity"></div>

            <aside id="sidebar"
                class="absolute inset-y-0 left-0 w-72 bg-white dark:bg-dracula-sidebar border-r border-gray-200 dark:border-dracula-current transform -translate-x-full transition-transform duration-300 z-40 flex flex-col shadow-xl dark:shadow-2xl h-full">
                <div
                    class="p-3 border-b border-gray-200 dark:border-dracula-current bg-white dark:bg-dracula-sidebar shrink-0 space-y-3 transition-colors">
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-dracula-comment text-[18px]">search</span>
                        <input id="search-input" type="text" placeholder="検索"
                            class="w-full pl-9 pr-11 py-2 rounded bg-gray-50 dark:bg-dracula-bg border border-gray-200 dark:border-dracula-current text-gray-900 dark:text-dracula-fg focus:outline-none focus:border-blue-500 dark:focus:border-dracula-cyan text-sm transition-colors">
                        <button id="clear-search-btn"
                            class="hidden search-clear-btn text-gray-400 hover:text-gray-700 dark:text-dracula-comment dark:hover:text-dracula-fg"
                            title="検索をクリア">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div class="segmented-control">
                        <button class="search-mode-btn active" data-search-mode="file">ファイル</button>
                        <button class="search-mode-btn" data-search-mode="content">本文</button>
                        <button class="search-mode-btn" data-search-mode="current">現在</button>
                    </div>
                    <p id="search-status" class="text-[11px] text-gray-500 dark:text-dracula-comment min-h-[1rem]"></p>
                    <div id="search-results" class="hidden max-h-72 overflow-y-auto space-y-1"></div>
                </div>
                <div class="flex-grow overflow-y-auto p-2 text-sm pb-10" id="tree-root"></div>
            </aside>

            <div id="scroll-container" class="flex-grow overflow-auto w-full h-full relative"
                style="-webkit-overflow-scrolling: touch;">
                <div id="zoom-controls"
                    class="hidden sticky left-1/2 top-3 z-20 mt-3 w-fit -translate-x-1/2 items-center space-x-1 rounded border border-gray-200 bg-white/95 p-1 shadow-sm backdrop-blur transition-colors dark:border-dracula-current dark:bg-dracula-sidebar/95">
                    <button id="zoom-out-btn"
                        class="text-gray-600 hover:bg-gray-200 hover:text-gray-900 dark:text-dracula-comment dark:hover:bg-dracula-current dark:hover:text-dracula-fg px-2 rounded transition-colors">-</button>
                    <span id="zoom-level"
                        class="text-xs text-gray-700 dark:text-dracula-fg w-10 text-center cursor-pointer font-mono">100%</span>
                    <button id="zoom-in-btn"
                        class="text-gray-600 hover:bg-gray-200 hover:text-gray-900 dark:text-dracula-comment dark:hover:bg-dracula-current dark:hover:text-dracula-fg px-2 rounded transition-colors">+</button>
                </div>
                <div id="current-search-bar"
                    class="hidden sticky top-0 z-10 bg-white/95 dark:bg-dracula-sidebar/95 backdrop-blur border-b border-gray-200 dark:border-dracula-current px-3 py-2 transition-colors">
                    <div class="max-w-4xl mx-auto flex items-center gap-2">
                        <span class="material-symbols-outlined text-gray-400 dark:text-dracula-comment">find_in_page</span>
                        <input id="current-search-input" type="text" placeholder="現在のファイル内を検索"
                            class="min-w-0 flex-1 py-1.5 px-2 rounded bg-gray-50 dark:bg-dracula-bg border border-gray-200 dark:border-dracula-current text-gray-900 dark:text-dracula-fg focus:outline-none focus:border-blue-500 dark:focus:border-dracula-cyan text-sm transition-colors">
                        <span id="current-search-count"
                            class="text-xs text-gray-500 dark:text-dracula-comment tabular-nums min-w-[3.5rem] text-right">0/0</span>
                        <button id="current-prev-btn" class="icon-btn text-gray-500 hover:bg-gray-100 hover:text-gray-900 dark:text-dracula-comment dark:hover:bg-dracula-current dark:hover:text-dracula-fg disabled:opacity-40"
                            title="前の一致">
                            <span class="material-symbols-outlined">keyboard_arrow_up</span>
                        </button>
                        <button id="current-next-btn" class="icon-btn text-gray-500 hover:bg-gray-100 hover:text-gray-900 dark:text-dracula-comment dark:hover:bg-dracula-current dark:hover:text-dracula-fg disabled:opacity-40"
                            title="次の一致">
                            <span class="material-symbols-outlined">keyboard_arrow_down</span>
                        </button>
                    </div>
                </div>

                <div id="empty-state"
                    class="absolute inset-0 flex items-center justify-center text-gray-400 dark:text-dracula-comment flex-col h-full pointer-events-none">
                    <p class="text-sm">左上のメニューからファイルを選択してください</p>
                </div>

                <div id="pdf-wrapper" class="hidden flex-col items-center py-4 space-y-3 mx-auto"
                    style="width: 100%; max-width: 800px;"></div>

                <div id="md-wrapper" class="hidden markdown-body p-6 mx-auto w-full max-w-4xl pb-20"></div>

            </div>
        </div>
    </div>

    <div id="shortcuts-modal"
        class="hidden fixed inset-0 z-[120] bg-black/45 dark:bg-black/60 items-center justify-center p-4">
        <div
            class="w-full max-w-lg bg-white dark:bg-dracula-sidebar border border-gray-200 dark:border-dracula-current rounded-lg shadow-2xl overflow-hidden">
            <div
                class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-dracula-current">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-600 dark:text-dracula-cyan">keyboard</span>
                    <h2 class="font-semibold text-gray-800 dark:text-dracula-fg">ショートカット</h2>
                </div>
                <button id="close-shortcuts-btn"
                    class="icon-btn text-gray-400 hover:text-gray-700 hover:bg-gray-100 dark:text-dracula-comment dark:hover:text-dracula-fg dark:hover:bg-dracula-current"
                    title="閉じる">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-4 space-y-3 text-sm">
                <div class="flex items-center justify-between gap-4">
                    <span>ショートカット一覧</span>
                    <span><kbd class="shortcut-kbd">⌘</kbd> <kbd class="shortcut-kbd">/</kbd></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span>検索へ移動</span>
                    <span><kbd class="shortcut-kbd">⌘</kbd> <kbd class="shortcut-kbd">K</kbd></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span>現在のファイル内検索</span>
                    <span><kbd class="shortcut-kbd">⌘</kbd> <kbd class="shortcut-kbd">F</kbd></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span>サイドバー表示切替</span>
                    <span><kbd class="shortcut-kbd">⌘</kbd> <kbd class="shortcut-kbd">B</kbd></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span>次のテーマへ切り替え</span>
                    <span><kbd class="shortcut-kbd">⌘</kbd> <kbd class="shortcut-kbd">⇧</kbd> <kbd class="shortcut-kbd">L</kbd></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span>PDF拡大/縮小</span>
                    <span><kbd class="shortcut-kbd">⌘</kbd> <kbd class="shortcut-kbd">+</kbd> / <kbd class="shortcut-kbd">-</kbd></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span>閉じる/読み込みキャンセル</span>
                    <span><kbd class="shortcut-kbd">Esc</kbd></span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
